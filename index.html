<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Veterinaria Génesis</title>
    <!-- Esta es la única línea que el robot de GitHub modificará -->
    <base href="/VeterinariaGenesis1/" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="VeterinariaGenesis.Client.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
        
        // Immediate check to prevent flashing
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        window.themeManager = {
            setTheme: (theme) => {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            },
            getTheme: () => {
                return document.documentElement.classList.contains('dark') ? 'dark' : 'light';
            }
        };
    </script>
</head>

<body>
    <div id="app">
        <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; font-family: sans-serif;">
            <div style="width: 60px; height: 60px; border: 5px solid #e2e8f0; border-top: 5px solid #4f46e5; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <h2 style="margin-top: 20px; color: #1e293b; font-weight: 600;">Sincronizando Veterinaria Génesis...</h2>
            <p style="color: #64748b;">Conectando con el servidor en la nube</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    
    <!-- Script estándar exacto para que .NET lo intercepte y le ponga el código hash -->
    <script src="_framework/blazor.webassembly.zxhwjtv6sc.js" autostart="false"></script>
    <script>
        window.imprimirDocumento = () => {
            window.print();
        };
    </script>
    <style>
        @media print {
            .no-print, aside, header, nav, button, .bg-slate-900, .fixed, .mb-6.flex.justify-between {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            .page-transition {
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
            }
            body {
                background: white !important;
                color: black !important;
            }
            .rounded-xl, .rounded-3xl, .rounded-\[2\.5rem\] {
                border-radius: 0 !important;
                border: none !important;
                box-shadow: none !important;
            }
            .shadow-sm, .shadow-md, .shadow-lg, .shadow-xl, .shadow-2xl {
                box-shadow: none !important;
                border: 1px solid #f1f5f9 !important;
            }
            .bg-slate-50, .bg-gray-50 {
                background: #fafafa !important;
            }
            .bg-indigo-600, .bg-blue-600 {
                background: white !important;
                color: black !important;
                border-bottom: 2px solid #4f46e5 !important;
            }
            .text-white {
                color: black !important;
            }
        }
        .print-only {
            display: none;
        }
    </style>
    <script>
      Blazor.start({
        loadBootResource: function (type, name, defaultUri, integrity) {
          // Retornar explícitamente un 'fetch' con integrity vacío para forzar
          // al navegador a ignorar la verificación de seguridad que rompe GitHub Pages.
          // NOTA: Para el archivo principal 'dotnetjs', Blazor exige que se retorne una cadena de texto (URI), no una Promesa.
          if (type !== 'dotnetjs') {
            return fetch(defaultUri, {
              cache: 'no-cache',
              integrity: ''
            });
          }
          return defaultUri;
        }
      });
    </script>

    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</body>
</html>
